services:
  db:
    image: postgres:16-alpine
    container_name: esport_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-TOURNAMEN_ESPORT}
    volumes:
      - esport_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-TOURNAMEN_ESPORT}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: esport_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-TOURNAMEN_ESPORT}
      DATABASE_MIGRATOR_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-TOURNAMEN_ESPORT}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET (>=32 bytes) in .env}
      BIND_ADDR: 0.0.0.0:8080
      DIST_DIR: /app/dist
      RUST_LOG: ${RUST_LOG:-info}
    expose:
      - "8080"

  caddy:
    image: caddy:2-alpine
    container_name: esport_caddy
    restart: unless-stopped
    depends_on:
      - app
    environment:
      DOMAIN: ${DOMAIN:-:80}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  esport_db_data:
  caddy_data:
  caddy_config:
